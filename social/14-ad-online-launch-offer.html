<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mowj — Ad: Online Launch Offer</title>
<script>if (location.hash === "#story") document.documentElement.classList.add("story");</script>
<link rel="stylesheet" href="base.css" />
<style>
  .photo { opacity: 0.42; object-position: 50% 40%; filter: blur(2px); }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.45) 35%, rgba(0,0,0,.6) 65%, rgba(0,0,0,.9) 100%); }
  .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 96px 90px 84px; }
  .logo { height: 96px; }
  .spacer { flex: 1; }
  .eyebrow { font-size: 22px; color: rgba(255,255,255,.75); }
  .title { font-size: 128px; margin-top: 30px; }
  .badge { margin-top: 30px; display: inline-block; border: 2px solid rgba(255,255,255,.45); border-radius: 999px; padding: 12px 34px; font-size: 22px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; }
  .prices { margin-top: 44px; display: flex; gap: 90px; justify-content: center; }
  .price { display: flex; flex-direction: column; align-items: center; }
  .price .row { display: flex; align-items: baseline; gap: 18px; }
  .price s { font-size: 50px; font-weight: 600; color: rgba(255,255,255,.45); }
  .price .now { font-size: 104px; font-weight: 700; line-height: 1; }
  .price .len { margin-top: 10px; font-size: 22px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: rgba(255,255,255,.7); }
  .tag { margin-top: 44px; font-size: 29px; line-height: 1.45; color: rgba(255,255,255,.88); max-width: 820px; text-wrap: balance; }
  .pill { margin-top: 44px; }
  .limited { margin-top: 24px; font-size: 34px; font-style: italic; font-weight: 500; opacity: 0.9; }
  .story .content { padding-top: 280px; padding-bottom: 440px; }
</style>
</head>
<body>
  <div class="post">
    <img class="photo" src="assets/keys.jpg" alt="" />
    <div class="shade"></div>
    <div class="content">
      <img class="logo" src="assets/logo-white.webp" alt="" />
      <div class="spacer"></div>
      <p class="eyebrow">Now Offering Online Lessons</p>
      <h1 class="title">Launch Offer</h1>
      <div class="prices">
        <div class="price">
          <div class="row serif"><s>$80</s><span class="now">$60</span></div>
          <span class="len">30 Min Lesson</span>
        </div>
        <div class="price">
          <div class="row serif"><s>$105</s><span class="now">$85</span></div>
          <span class="len">45 Min Lesson</span>
        </div>
      </div>
      <p class="tag">Live, one-on-one piano lessons anywhere in the US &amp; Canada. Enroll by November 30 and keep this rate for as long as you stay enrolled.</p>
      <div class="spacer"></div>
      <span class="pill light">Book Your Trial Lesson</span>
      <p class="limited serif">Offer ends November 30</p>
    </div>
  </div>
</body>
</html>
