<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mowj — Ad: I Used To Play</title>
<script>if (location.hash === "#story") document.documentElement.classList.add("story");</script>
<link rel="stylesheet" href="base.css" />
<style>
  .content { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 96px 90px 84px; }
  .logo { height: 96px; }
  .spacer { flex: 1; }
  .title { font-size: 150px; line-height: 1.02; }
  .struck { position: relative; display: inline-block; color: rgba(255,255,255,.42); }
  .struck::after {
    content: ""; position: absolute; left: -3%; right: -3%; top: 52%;
    height: 7px; background: #fff; border-radius: 4px; transform: rotate(-4deg);
  }
  .tag { margin-top: 64px; font-size: 30px; line-height: 1.45; color: rgba(255,255,255,.85); max-width: 760px; text-wrap: balance; }
  .pill { margin-top: 48px; }
  .limited { margin-top: 26px; font-size: 32px; font-style: italic; font-weight: 500; opacity: 0.85; }

  /* 9:16 Stories / Reels */
  .story .content { padding-top: 280px; padding-bottom: 440px; }
</style>
</head>
<body>
  <div class="post hero-gradient">
    <div class="content">
      <img class="logo" src="assets/logo-white.webp" alt="" />
      <div class="spacer"></div>
      <h1 class="title">I<br /><span class="struck">used to</span><br />play piano.</h1>
      <p class="tag">Private lessons for adults coming back to the keys. Pick up right where you left off.</p>
      <div class="spacer"></div>
      <span class="pill light">Book Your Trial Lesson</span>
      <p class="limited serif">Limited spots remain for Fall 2026</p>
    </div>
  </div>
</body>
</html>
