<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mowj — Intro Post</title>
<link rel="stylesheet" href="base.css" />
<style>
  .photo { opacity: 0.62; object-position: 50% 50%; transform: scale(1.04); }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.35) 42%, rgba(0,0,0,.78) 100%); }
  .content { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 110px 80px 96px; }
  .logo { height: 250px; width: auto; }
  .title { font-size: 124px; margin-top: 120px; }
  .sub { margin-top: 52px; font-size: 44px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .formats { margin-top: 56px; opacity: 0.88; }
  .spacer { flex: 1; }
  .enroll { font-size: 40px; font-style: italic; font-weight: 500; }
  .url { margin-top: 22px; font-size: 22px; letter-spacing: 0.24em; text-transform: uppercase; opacity: 0.8; }
</style>
</head>
<body>
  <div class="post">
    <img class="photo" src="assets/hands.jpg" alt="" />
    <div class="shade"></div>
    <div class="content">
      <img class="logo" src="assets/logo-white.webp" alt="" />
      <h1 class="title">Private<br />Piano Lessons</h1>
      <p class="eyebrow formats">Online &nbsp;·&nbsp; In-Studio</p>
      <div class="spacer"></div>
      <div class="rule" style="margin-bottom: 40px"></div>
      <p class="enroll serif">Fall 2026 enrollment now open</p>
      <p class="url">mowjmusicacademy.com</p>
    </div>
  </div>
</body>
</html>
